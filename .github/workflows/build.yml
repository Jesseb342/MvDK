
name: Build unsigned nxnative IPA

on:
  workflow_dispatch:
    inputs:
      device_target:
        description: "Choose your target iPhone"
        required: true
        type: choice
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional base-game title ID override, e.g. 0100B99019412000"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nxnative-ipa-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      GAME_URL: ${{ secrets.Game_URL }}
      UPDATE_URL: ${{ secrets.Update_URL }}
      DLC_URL: ${{ secrets.DLC_URL }}
      KEYS_URL: ${{ secrets.Keys_URL }}
      DEVICE_TARGET: ${{ inputs.device_target }}
      PROFILE_OVERRIDE: ${{ inputs.profile_id }}
      GAME_DIR: ${{ github.workspace }}/GameFiles

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$GAME_URL" ]] || {
            echo "::error::Missing repository secret Game_URL"
            exit 1
          }

          [[ -n "$KEYS_URL" ]] || {
            echo "::error::Missing repository secret Keys_URL"
            exit 1
          }

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew update
          brew install dotnet gdown lz4 zstd spirv-cross xcodegen unar p7zip

          python3 -m venv "$RUNNER_TEMP/nxnative-venv"
          source "$RUNNER_TEMP/nxnative-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install capstone fonttools lz4 zstandard

          echo "$RUNNER_TEMP/nxnative-venv/bin" >> "$GITHUB_PATH"

      - name: Download the selected nxnative source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DEVICE_TARGET" == "iPhone 15 or older (BC fallback)" ]]; then
            REPO_URL="https://codeload.github.com/mianmuhammadse/nxnative/tar.gz/d158df611bf2f3fa315c4f16585575cdfdb2a1d3"
            ARCHIVE="$RUNNER_TEMP/nxnative-bc-fallback.tar.gz"

            echo "Downloading the BC-fallback source archive..."
            curl --fail --location --retry 3 \
              "$REPO_URL" \
              --output "$ARCHIVE"

            mkdir -p nxnative
            tar -xzf "$ARCHIVE" \
              --strip-components=1 \
              -C nxnative

            test -f nxnative/scripts/build_ipa_from_nsp.py || {
              echo "::error::Downloaded archive is missing the expected build script."
              exit 1
            }

            echo "NXNATIVE_MODE=bc-fallback" >> "$GITHUB_ENV"
          else
            git clone https://github.com/seedds/nxnative.git nxnative
            git -C nxnative checkout main
            echo "NXNATIVE_MODE=standard" >> "$GITHUB_ENV"
          fi

          echo "NXNATIVE_DIR=$GITHUB_WORKSPACE/nxnative" >> "$GITHUB_ENV"

      - name: Rebuild shader translator from repository source
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          MACHINE="$(uname -m)"

          case "$MACHINE" in
            arm64|aarch64)
              RID="osx-arm64"
              ;;
            x86_64)
              RID="osx-x64"
              ;;
            *)
              echo "::error::Unsupported Mac runner architecture: $MACHINE"
              exit 1
              ;;
          esac

          echo "Runner architecture: $MACHINE"
          echo "Building dmsh_xlate for $RID"

          dotnet publish dm/gfx/tools/dmsh_xlate \
            -c Release \
            -r "$RID" \
            -o dm/gfx/tools/dmsh_xlate_bin

          test -d dm/gfx/tools/dmsh_xlate_bin || {
            echo "::error::Translator output directory was not created."
            exit 1
          }

          echo "Translator output:"
          ls -la dm/gfx/tools/dmsh_xlate_bin

          if [[ -f dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate ]]; then
            chmod +x dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
          fi

          if [[ -f dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate.dll ]]; then
            echo "Translator DLL was generated."
          elif [[ -f dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate ]]; then
            echo "Translator executable was generated."
          else
            echo "::error::Expected dmsh_xlate executable or DLL was not generated."
            exit 1
          fi

      - name: Download game, optional update/DLC, and keys
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GAME_DIR/downloads" "$GAME_DIR/keys"

          download_drive_file() {
            local url="$1"
            local destination="$2"
            local label="$3"

            [[ -n "$url" ]] || {
              echo "Skipping optional $label."
              return 0
            }

            echo "Downloading $label..."
            gdown "$url" -O "$destination"

            test -s "$destination" || {
              echo "::error::$label download produced an empty file."
              exit 1
            }

            if [[ "$destination" == "$GAME_DIR/keys/prod.keys" ]]; then
              return 0
            fi

            local file_type
            file_type="$(file -b "$destination")"

            case "$file_type" in
              *"Zip archive"*)
                mv "$destination" "${destination}.zip"
                ;;
              *"RAR archive"*)
                mv "$destination" "${destination}.rar"
                ;;
              *"7-zip archive"*)
                mv "$destination" "${destination}.7z"
                ;;
              *"gzip compressed"*)
                mv "$destination" "${destination}.tar.gz"
                ;;
              *)
                mv "$destination" "${destination}.nsp"
                ;;
            esac
          }

          download_drive_file "$GAME_URL" "$GAME_DIR/downloads/game" "base game"
          download_drive_file "$UPDATE_URL" "$GAME_DIR/downloads/update" "update"
          download_drive_file "$DLC_URL" "$GAME_DIR/downloads/dlc" "DLC"
          download_drive_file "$KEYS_URL" "$GAME_DIR/keys/prod.keys" "prod.keys"

          test -s "$GAME_DIR/keys/prod.keys" || {
            echo "::error::prod.keys download failed. Check Keys_URL."
            exit 1
          }

      - name: Extract archives and collect NSP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GAME_DIR/extracted" "$GAME_DIR/nsp"
          shopt -s nullglob

          for file in "$GAME_DIR"/downloads/*; do
            [[ -f "$file" ]] || continue

            echo "Checking $(basename "$file")"

            case "$file" in
              *.zip|*.ZIP)
                ditto -x -k "$file" "$GAME_DIR/extracted"
                ;;
              *.rar|*.RAR)
                unar -force-overwrite \
                  -output-directory "$GAME_DIR/extracted" "$file"
                ;;
              *.7z|*.7Z)
                7z x -y "-o$GAME_DIR/extracted" "$file"
                ;;
              *.tar.gz|*.tgz)
                tar -xzf "$file" -C "$GAME_DIR/extracted"
                ;;
              *)
                cp -f "$file" "$GAME_DIR/extracted/$(basename "$file")"
                ;;
            esac
          done

          find "$GAME_DIR/extracted" -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) \
            -exec cp -f {} "$GAME_DIR/nsp/" \;

          find "$GAME_DIR/downloads" -maxdepth 1 -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) \
            -exec cp -f {} "$GAME_DIR/nsp/" \;

          if ! find "$GAME_DIR/nsp" -maxdepth 1 -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) \
            -print -quit | grep -q .; then
            echo "::error::No NSP/NSZ packages found."
            echo "Check that the Drive links point to actual package files or supported archives."
            exit 1
          fi

          echo "Packages found:"
          find "$GAME_DIR/nsp" -maxdepth 1 -type f -print

      - name: Identify base game title ID
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$PROFILE_OVERRIDE" ]]; then
            DM_GAME="${PROFILE_OVERRIDE^^}"
            DM_GAME="${DM_GAME#0X}"
          else
            BASE_FILE="$(
              find "$GAME_DIR/nsp" -maxdepth 1 -type f \
                -iname '*.nsp' |
                grep -Ei '\[v0\]' |
                head -n 1 || true
            )"

            if [[ -z "$BASE_FILE" ]]; then
              BASE_FILE="$(
                find "$GAME_DIR/nsp" -maxdepth 1 -type f \
                  -iname '*.nsp' |
                  grep -Eiv '\[v[1-9][0-9]*\]' |
                  head -n 1 || true
              )"
            fi

            if [[ -z "$BASE_FILE" ]]; then
              BASE_FILE="$(
                find "$GAME_DIR/nsp" -maxdepth 1 -type f \
                  -iname '*.nsp' |
                  head -n 1 || true
              )"
            fi

            DM_GAME="$(
              basename "$BASE_FILE" |
              grep -Eio '\[([0-9a-f]{16})\]' |
              head -n 1 |
              tr -d '[]' |
              tr '[:lower:]' '[:upper:]' || true
            )"
          fi

          if [[ ! "$DM_GAME" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Could not identify a valid 16-character title ID."
            echo "Rerun with profile_id set to the base game's title ID."
            exit 1
          fi

          echo "DM_GAME=$DM_GAME" >> "$GITHUB_ENV"
          echo "Title ID: $DM_GAME"

      - name: Prepare game directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GAME_DIR/GameFiles"

          find "$GAME_DIR/nsp" -maxdepth 1 -type f \
            \( -iname '*.nsp' -o -iname '*.nsz' \) \
            -exec cp -f {} "$GAME_DIR/GameFiles/" \;

          echo "BUILD_GAME_DIR=$GAME_DIR/GameFiles" >> "$GITHUB_ENV"

      - name: Import upstream game profile if missing
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="$NXNATIVE_DIR/dm/games/$DM_GAME"

          if [[ -f "$PROFILE/game.tsv" ]]; then
            echo "Game profile already exists."
            exit 0
          fi

          git clone --depth 1 \
            https://github.com/seedds/nxnative.git \
            "$RUNNER_TEMP/upstream-nxnative"

          UPSTREAM_PROFILE="$RUNNER_TEMP/upstream-nxnative/dm/games/$DM_GAME"

          if [[ -f "$UPSTREAM_PROFILE/game.tsv" ]]; then
            mkdir -p "$PROFILE"
            cp -R "$UPSTREAM_PROFILE/." "$PROFILE/"
            echo "Imported upstream profile for $DM_GAME."
          else
            echo "No upstream profile found for $DM_GAME."
            echo "The builder may need to generate a profile."
          fi

      - name: Repair shader-chain lock and header
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail
          export DM_GAME

          echo "Verifying rebuilt translator source hash:"
          dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate --source-sha

          python3 dm/gfx/tools/dmsh_chain.py --update-lock
          python3 dm/gfx/tools/dmsh_chain.py --header

      - name: First IPA build attempt
        id: first_build
        continue-on-error: true
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          python3 scripts/build_ipa_from_nsp.py \
            "$BUILD_GAME_DIR" \
            -k "$GAME_DIR/keys/prod.keys" \
            -o "$GAME_DIR/${DM_GAME}.ipa"

      - name: Generate Mac shader outputs and profile tables
        id: generate_tables
        if: steps.first_build.outcome == 'failure'
        shell: bash
        working-directory: nxnative
        env:
          DM_GAME: ${{ env.DM_GAME }}
        run: |
          set -euo pipefail

          REPO="$GITHUB_WORKSPACE/nxnative"
          BUILD_DIR="$BUILD_GAME_DIR/${DM_GAME}_build"
          SHADER_PKG="$BUILD_DIR/shader/pkg"
          SHADER_CACHE="$BUILD_DIR/shader/cache"
          PROFILE_DIR="$REPO/dm/games/$DM_GAME"

          if [[ ! -d "$SHADER_PKG" ]]; then
            echo "::error::Shader package directory not found: $SHADER_PKG"
            find "$BUILD_GAME_DIR" -maxdepth 5 -type d -print || true
            exit 1
          fi

          if [[ ! -f "$PROFILE_DIR/game.tsv" ]]; then
            echo "::error::Profile game.tsv not found: $PROFILE_DIR/game.tsv"
            exit 1
          fi

          mkdir -p "$SHADER_CACHE"

          echo "Running full Mac-side shader build..."
          DM_GAME="$DM_GAME" python3 dm/gfx/tools/dmsh_build.py \
            "$SHADER_PKG" \
            "$SHADER_CACHE"

          CHAIN="$(
            find "$SHADER_CACHE" -maxdepth 1 -type d -name 'b-*' \
              -print |
              head -n 1 |
              xargs basename 2>/dev/null |
              sed 's/^b-//' || true
          )"

          if [[ -z "$CHAIN" ]]; then
            echo "::error::No b-<chain> Mac shader output directory was generated."
            find "$SHADER_CACHE" -maxdepth 4 -print || true
            exit 1
          fi

          MAC_LIB_DIR="$SHADER_CACHE/b-$CHAIN"

          python3 dm/gfx/tools/c1_guard.py \
            "$MAC_LIB_DIR" \
            "$PROFILE_DIR/c1_full.tsv"

          python3 dm/gfx/tools/cb_extent.py \
            "$MAC_LIB_DIR" \
            "$PROFILE_DIR/cb_extent.tsv"

          test -s "$PROFILE_DIR/c1_full.tsv"
          test -s "$PROFILE_DIR/cb_extent.tsv"

          echo "Generated tables:"
          ls -lh "$PROFILE_DIR/c1_full.tsv" "$PROFILE_DIR/cb_extent.tsv"

      - name: Retry IPA build after generating tables
        if: steps.first_build.outcome == 'failure' && steps.generate_tables.outcome == 'success'
        shell: bash
        working-directory: nxnative
        run: |
          set -euo pipefail

          python3 scripts/build_ipa_from_nsp.py \
            "$BUILD_GAME_DIR" \
            -k "$GAME_DIR/keys/prod.keys" \
            -o "$GAME_DIR/${DM_GAME}.ipa"

      - name: Upload IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-${{ env.DM_GAME }}-IPA-and-logs
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/GameFiles/*.ipa
            ${{ github.workspace }}/GameFiles/GameFiles/*_build/logs/**
            ${{ github.workspace }}/GameFiles/GameFiles/*_build/shader/**
            ${{ github.workspace }}/GameFiles/GameFiles/*.nsp
          retention-days: 7
